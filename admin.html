<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin panel</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body style="overflow:auto">
<main>
  <section class="stage">
    <h1>Admin panel</h1>
    <div id="gate">
      <p class="txt" style="min-height:0">Enter your password to continue.</p>
      <input id="pw" type="password" placeholder="Password" autocomplete="off">
      <button class="next" id="login">Open</button>
      <p class="note" id="gerr"></p>
    </div>
    <div id="panel" class="hide">
      <div class="card" style="text-align:left;font-size:1rem"><b>Answers</b>
        <div id="st">Waiting for her…</div>
        <div id="cnt" class="note" style="margin-top:6px"></div>
        <p class="note" id="mode"></p>
        <ul id="log"></ul>
      </div>
      <button class="next" id="refresh">Refresh</button>
    </div>
  </section>
</main>
<script src="store.js"></script>
<script src="admin.js"></script>
</body>
</html>
